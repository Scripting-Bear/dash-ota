buildscript {
  ext.DashOta = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return DashOta[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

android {
  namespace "com.dashota"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    // Shipped to consuming apps so a minified release build does not break zstd decompression.
    consumerProguardFiles "consumer-rules.pro"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  // Unit tests run on the JVM under Robolectric, so the trust-critical logic (crypto, the slot
  // state machine, the crash-loop breaker) is covered without a device or an emulator.
  testOptions {
    unitTests {
      includeAndroidResources = true
      returnDefaultValues = false
    }
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  // Package-based crypto: Google Tink for Ed25519 verification (raw 32-byte public key).
  // AES-256-GCM, SHA-256 and HMAC use the JDK (javax.crypto / java.security) directly.
  implementation "com.google.crypto.tink:tink-android:1.13.0"
  // Per-blob decompression.
  //
  // Pinned at 1.5.7-4 deliberately. Later builds declare a compileSdk 37 floor in their AAR
  // metadata, which would force every consumer to bump; and 1.5.6-9 and earlier ship .so files that
  // are NOT 16 KB page aligned on armeabi-v7a, x86 and x86_64, which Google Play now rejects.
  // 1.5.7-4 is the newest release that is aligned on every ABI and imposes no SDK floor.
  // Re-check both properties before bumping.
  implementation "com.github.luben:zstd-jni:1.5.7-4@aar"

  testImplementation "junit:junit:4.13.2"
  testImplementation "androidx.test:core:1.6.1"
  testImplementation "org.robolectric:robolectric:4.14.1"
  // The JVM's org.json stub throws; the real implementation is needed to parse manifests in tests.
  testImplementation "org.json:json:20240303"
  // The runtime dependency is the @aar, whose natives are Android-only. Unit tests run on the JVM,
  // so they need the plain jar's host natives to exercise the real zstd rather than a stub.
  testImplementation "com.github.luben:zstd-jni:1.5.7-4"
}
