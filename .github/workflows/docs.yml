name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# allow one concurrent deployment; don't cancel an in-progress production deploy
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: each page's "Last updated" date comes from git log.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # 20.19 is the floor @mongodb-js/zstd sets for the CLI and backend; keep the docs
          # toolchain on the same one so `check:docs` compares against what we actually ship.
          node-version: '20.19'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # `prebuild` runs check:docs (commands, flags, admonitions, Node floor, API drift) and
      # regenerates llms.txt. `onBrokenLinks: throw` makes a dead link fail the build.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: website/build

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
