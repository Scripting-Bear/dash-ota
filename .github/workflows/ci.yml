name: CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - '.prettierrc.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - '.prettierrc.json'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · format · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # packages/rn is deliberately not an npm workspace (it has its own yarn.lock and RN
      # toolchain), so root `npm ci` does not install it and `test:rn` would find no jest preset.
      - name: Install the React Native package
        run: corepack enable && yarn install --immutable
        working-directory: packages/rn
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Native source check
        run: npm run lint:native
      # test:dist exercises the built artifacts on purpose — every other suite runs against src
      # via --conditions source, so a stale dist would otherwise stay invisible.
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test

  # The Swift sources import Apple frameworks, so they cannot build on the Linux runner — the
  # Linux `npm test` skips them. Run them where they can actually run; macOS minutes are free
  # for public repositories.
  ios:
    name: iOS store tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm run test:ios
